name: Fire Clicker Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP'i çıkar
        run: |
          mkdir project
          unzip -q FireClicker_Android_Hazir.zip -d project

      - name: Android APK ve AAB oluştur
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: FireClicker-APK
          path: project/app/build/outputs/apk/debug/*.apk

      - name: AAB'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: FireClicker-AAB
          path: project/app/build/outputs/bundle/release/*.aab
